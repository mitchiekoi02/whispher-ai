<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whisper AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #0f0f12;
  color: white;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

.panel {
  background: #17171c;
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
}

.hidden {
  display: none;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  box-sizing: border-box;
}

button {
  background: #7c4dff;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* ======================
   CHARACTER GRID
====================== */

.character-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 10px;
}

.character-card {
  background: #1b1b22;
  padding: 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.character-card:hover {
  background: #252535;
  transform: translateY(-2px);
}

/* ======================
   CHAT
====================== */

.chat-box {
  height: 420px;
  overflow-y: auto;
  background: #111116;
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}

.message {
  margin: 8px 0;
  white-space: pre-wrap;
}

.user {
  text-align: right;
  color: #7c4dff;
}

.ai {
  text-align: left;
  color: #ddd;
}

</style>
</head>

<body>

<div class="container">

  <h1>Whisper AI</h1>

  <!-- LOGIN -->
  <div id="loginBox" class="panel">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- CHARACTERS -->
  <div id="characterBox" class="panel hidden">
    <h2>Choose Character</h2>

    <!-- IMPORTANT: JS injects cards here -->
    <div id="characterGrid" class="character-grid"></div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="panel hidden">

    <!-- FIXED: prevents crash -->
    <h2 id="charName">Select a character</h2>

    <div id="chat" class="chat-box"></div>

    <input id="msg" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
