<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whisper AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ======================
   BASE (CINEMATIC UPGRADE)
====================== */

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1a1a25, #0f0f12 60%);
  color: white;
  margin: 0;
  overflow-x: hidden;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

.panel {
  background: rgba(23, 23, 28, 0.85);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
}

.hidden {
  display: none;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  box-sizing: border-box;
}

button {
  background: linear-gradient(135deg, #7c4dff, #9b6bff);
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

/* ======================
   LOGIN (CINEMATIC CENTER)
====================== */

#loginBox {
  max-width: 420px;
  margin: auto;
}

/* ======================
   NETFLIX CHARACTER SCREEN
====================== */

#characterBox {
  overflow: hidden;
  min-height: 60vh;
  position: relative;
}

/* FIXED TYPO + CINEMATIC BACKDROP */
.netflix-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(55px) brightness(0.25) saturate(1.3);
  transform: scale(1.3);
  z-index: 0;
  transition: 0.6s ease;
}

/* animated glow overlay */
.netflix-overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(124,77,255,0.15), transparent 60%),
    radial-gradient(circle at bottom, rgba(0,0,0,0.8), #0f0f12 70%);
  z-index: 1;
}

/* title */
.netflix-title {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 20px;
  font-size: 1.8rem;
  letter-spacing: 0.5px;
  text-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

/* grid */
.character-grid {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 22px;
}

/* CARD (NETFLIX PROFILE STYLE) */
.character-card {
  width: 160px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.25s ease, filter 0.25s ease;
}

.character-card img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 18px;
  border: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  transition: 0.25s ease;
}

.character-card h3 {
  margin-top: 10px;
  font-size: 14px;
}

.character-card p {
  font-size: 12px;
  color: #aaa;
}

/* HOVER FOCUS (NETFLIX STYLE ZOOM) */
.character-card:hover {
  transform: scale(1.18);
  z-index: 5;
}

.character-card:hover img {
  border: 2px solid #7c4dff;
  box-shadow: 0 0 35px rgba(124,77,255,0.8);
}

/* DIM OTHER CARDS (JS CAN TOGGLE) */
.dim {
  opacity: 0.25;
  transform: scale(0.92);
  filter: blur(1px);
}

/* ======================
   CHAT UI (CINEMATIC CLEAN)
====================== */

.chat-box {
  height: 420px;
  overflow-y: auto;
  background: rgba(17, 17, 22, 0.85);
  backdrop-filter: blur(10px);
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
}

.message {
  margin: 8px 0;
  white-space: pre-wrap;
}

.user {
  text-align: right;
  color: #b794ff;
}

.ai {
  text-align: left;
  color: #e5e5e5;
}

</style>
</head>

<body>

<div class="container">

  <h1>Whisper AI</h1>

  <!-- LOGIN -->
  <div id="loginBox" class="panel">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- CHARACTER SCREEN -->
  <div id="characterBox" class="panel hidden">

    <div class="netflix-bg" id="netflixBg"></div>
    <div class="netflix-overlay"></div>

    <h2 class="netflix-title">Who do you want to talk to?</h2>

    <div id="characterGrid" class="character-grid"></div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="panel hidden">

    <h2 id="charName">Select a character</h2>

    <div id="chat" class="chat-box"></div>

    <input id="msg" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
