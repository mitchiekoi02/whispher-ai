<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whisper AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ======================
   BASE
====================== */

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1a1a25, #0f0f12 65%);
  color: white;
  margin: 0;
  overflow-x: hidden;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

.panel {
  background: rgba(23, 23, 28, 0.85);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.5);
}

.hidden {
  display: none;
}

/* ======================
   INPUTS (FIXED CRITICAL BUG)
====================== */

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  box-sizing: border-box;
}

/* ONLY BUTTONS (NOT INPUTS) */
button {
  padding: 12px 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #7c4dff, #9b6bff);
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
}

/* ======================
   LOGO
====================== */

.logo-header {
  display: flex;
  justify-content: center;
  margin: 20px 0 30px;
}

.logo-header img {
  height: 90px;
  max-width: 420px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 12px 30px rgba(0,0,0,0.6));
}

/* ======================
   CHARACTER SCREEN
====================== */

.character-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 22px;
}

.character-card {
  width: 160px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.25s ease;
}

.character-card img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 18px;
}

.character-card:hover {
  transform: scale(1.2);
}

/* ======================
   CHAT
====================== */

.chat-box {
  height: 420px;
  overflow-y: auto;
  background: rgba(17, 17, 22, 0.85);
  backdrop-filter: blur(12px);
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}

.message {
  margin: 8px 0;
  white-space: pre-wrap;
}

.user {
  text-align: right;
  color: #c7a6ff;
}

.ai {
  text-align: left;
  color: #e5e5e5;
}

/* ======================
   INPUT ROW (FIXED LAYOUT)
====================== */

.input-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  align-items: center;
}

/* BIG TEXT INPUT */
.input-row input {
  flex: 1;
  margin-top: 0;
}

/* SMALL ICON BUTTON */
.icon-btn {
  width: 44px;
  height: 44px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

/* SEND BUTTON NOT HUGE */
.send-btn {
  width: 90px;
  height: 44px;
  padding: 0;
}

/* ======================
   IMAGE PREVIEW
====================== */

.preview {
  margin-top: 10px;
  border-radius: 12px;
  overflow: hidden;
  max-height: 180px;
}

.preview img {
  width: 100%;
  object-fit: cover;
}

</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo-header">
    <img src="./images/whisperlogo.svg" alt="Whisper Logo">
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="panel">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- CHARACTER -->
  <div id="characterBox" class="panel hidden">
    <h2>Who do you want to talk to?</h2>
    <div id="characterGrid" class="character-grid"></div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="panel hidden">

    <h2 id="charName">Chat</h2>

    <div id="chat" class="chat-box"></div>

    <!-- IMAGE PREVIEW -->
    <div id="preview" class="preview hidden"></div>

    <!-- INPUT AREA -->
    <div class="input-row">

      <input id="msg" placeholder="Type your message...">

      <input
        id="imageInput"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
      >

      <button class="icon-btn"
        onclick="document.getElementById('imageInput').click()">
        📷
      </button>

      <button class="send-btn" onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
