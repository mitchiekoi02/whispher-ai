<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whisper AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ======================
   BASE
====================== */

body {
  font-family: 'Inter', sans-serif;
  background: #0f0f12;
  color: white;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

.panel {
  background: #17171c;
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
  position: relative;
}

.hidden {
  display: none;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  box-sizing: border-box;
}

button {
  background: #7c4dff;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* ======================
   LOGIN
====================== */

#loginBox {
  max-width: 420px;
  margin: auto;
}

/* ======================
   NETFLIX CHARACTER SCREEN
====================== */

#characterBox {
  overflow: hidden;
  min-height: 60vh;
  position: relative;
}

/* blurred cinematic background */
.netlix-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(40px) brightness(0.35);
  transform: scale(1.2);
  z-index: 0;
  transition: 0.4s ease;
}

/* dark overlay */
.netflix-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0,0,0,0.2), rgba(0,0,0,0.88));
  z-index: 1;
}

/* title */
.netflix-title {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 20px;
  font-size: 1.8rem;
}

/* grid */
.character-grid {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 22px;
}

/* CARD */
.character-card {
  width: 160px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.25s ease;
}

.character-card img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 16px;
  border: 2px solid transparent;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  transition: 0.25s ease;
}

.character-card h3 {
  margin-top: 10px;
  font-size: 14px;
}

.character-card:hover {
  transform: scale(1.15);
}

.character-card:hover img {
  border: 2px solid #7c4dff;
  box-shadow: 0 0 25px rgba(124,77,255,0.7);
}

/* dim others effect (optional JS support) */
.dim {
  opacity: 0.4;
  transform: scale(0.95);
}

/* ======================
   CHAT UI
====================== */

.chat-box {
  height: 420px;
  overflow-y: auto;
  background: #111116;
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}

.message {
  margin: 8px 0;
  white-space: pre-wrap;
}

.user {
  text-align: right;
  color: #7c4dff;
}

.ai {
  text-align: left;
  color: #ddd;
}

</style>
</head>

<body>

<div class="container">

  <h1>Whisper AI</h1>

  <!-- LOGIN -->
  <div id="loginBox" class="panel">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- CHARACTER SCREEN -->
  <div id="characterBox" class="panel hidden">

    <div class="netflix-bg" id="netflixBg"></div>
    <div class="netflix-overlay"></div>

    <h2 class="netflix-title">Who's watching?</h2>

    <div id="characterGrid" class="character-grid"></div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="panel hidden">

    <h2 id="charName">Select a character</h2>

    <div id="chat" class="chat-box"></div>

    <input id="msg" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
