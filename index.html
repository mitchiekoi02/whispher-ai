<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whisper AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0f0f12;
    color:white;
    min-height:100vh;
}

.container{
    max-width:900px;
    margin:auto;
    padding:24px;
}

/* ====================
   LOGO
==================== */

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-size:2.5rem;
    font-weight:700;
}

.logo p{
    color:#999;
    margin-top:8px;
}

/* ====================
   CARD
==================== */

.panel{
    background:#17171c;
    border:1px solid #24242b;
    border-radius:20px;
    padding:24px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.hidden{
    display:none;
}

/* ====================
   LOGIN
==================== */

#loginBox{
    max-width:450px;
    margin:auto;
}

#loginBox h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#24242b;
    color:white;
    margin-bottom:12px;
    font-size:15px;
}

input:focus{
    outline:none;
    border:1px solid #666;
}

button{
    width:100%;
    border:none;
    cursor:pointer;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    transition:.25s;
}

.primary-btn{
    background:#7c4dff;
    color:white;
}

.primary-btn:hover{
    transform:translateY(-2px);
}

.secondary-btn{
    background:#24242b;
    color:white;
    margin-top:10px;
}

/* ====================
   CHARACTERS
==================== */

.character-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-top:20px;
}

.character-card{
    background:#1b1b22;
    border:1px solid #292931;
    border-radius:18px;
    padding:20px;
    cursor:pointer;
    transition:.25s;
}

.character-card:hover{
    transform:translateY(-4px);
    border-color:#7c4dff;
}

.character-card h3{
    margin-bottom:8px;
}

.character-card p{
    color:#999;
    line-height:1.5;
}

/* ====================
   CHAT
==================== */

.chat-wrapper{
    display:flex;
    flex-direction:column;
    height:80vh;
}

.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.chat-header h2{
    font-size:1.2rem;
}

#chat{
    flex:1;
    overflow-y:auto;
    background:#111116;
    border:1px solid #24242b;
    border-radius:16px;
    padding:20px;
}

.message{
    margin-bottom:14px;
    max-width:80%;
}

.message.user{
    margin-left:auto;
}

.bubble{
    padding:14px 16px;
    border-radius:16px;
    line-height:1.5;
}

.user .bubble{
    background:#7c4dff;
}

.ai .bubble{
    background:#24242b;
}

.chat-input{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.chat-input input{
    margin:0;
}

.send-btn{
    width:140px;
    background:#7c4dff;
    color:white;
}

.send-btn:hover{
    opacity:.9;
}

/* ====================
   MOBILE
==================== */

@media(max-width:768px){

.chat-input{
    flex-direction:column;
}

.send-btn{
    width:100%;
}

.message{
    max-width:95%;
}

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>Whisper AI</h1>
        <p>Your adaptive AI companion</p>
    </div>

    <!-- LOGIN -->

    <div id="loginBox" class="panel">

        <h2>Welcome Back</h2>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button class="primary-btn" onclick="login()">
            Login
        </button>

        <button class="secondary-btn" onclick="signup()">
            Create Account
        </button>

    </div>

    <!-- CHARACTERS -->

    <div id="characterBox" class="panel hidden">

        <h2>Choose Your Companion</h2>

        <div class="character-grid">

            <div class="character-card" onclick="selectCharacter(0)">
                <h3>💕 Luna</h3>
                <p>
                    Warm, caring, loyal and emotionally supportive.
                </p>
            </div>

            <div class="character-card" onclick="selectCharacter(1)">
                <h3>😏 Mia</h3>
                <p>
                    Playful, teasing and full of chemistry.
                </p>
            </div>

            <div class="character-card" onclick="selectCharacter(2)">
                <h3>🎭 Aria</h3>
                <p>
                    Creative roleplay and immersive storytelling.
                </p>
            </div>

        </div>

    </div>

    <!-- CHAT -->

    <div id="chatBox" class="panel hidden">

        <div class="chat-wrapper">

            <div class="chat-header">
                <h2 id="companionName">
                    Luna
                </h2>
            </div>

            <div id="chat"></div>

            <div class="chat-input">

                <input
                    type="text"
                    id="msg"
                    placeholder="Send a message..."
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </div>

    </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
