<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whisper AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ======================
   BASE (CINEMATIC + LIVING UI)
====================== */

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1a1a25, #0f0f12 65%);
  color: white;
  margin: 0;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(124,77,255,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0,200,255,0.05), transparent 45%);
  pointer-events: none;
  animation: floatGlow 10s ease-in-out infinite alternate;
}

@keyframes floatGlow {
  from { transform: translateY(0px); }
  to { transform: translateY(-10px); }
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

.panel {
  background: rgba(23, 23, 28, 0.85);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
  position: relative;
  box-shadow: 0 25px 70px rgba(0,0,0,0.5);
}

.hidden {
  display: none;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  box-sizing: border-box;
}

button {
  background: linear-gradient(135deg, #7c4dff, #9b6bff);
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
}

/* ======================
   LOGO HEADER
====================== */

.logo-header {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 10px 0 20px;
}

.logo-header img {
  height: 55px;
  max-width: 240px;
  object-fit: contain;
  filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
}

/* ======================
   CHARACTER SCREEN
====================== */

#characterBox {
  overflow: hidden;
  min-height: 60vh;
  position: relative;
}

.netflix-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(60px) brightness(0.22) saturate(1.4);
  transform: scale(1.35);
  z-index: 0;
  transition: 0.7s ease;
}

.netflix-overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(124,77,255,0.18), transparent 55%),
    radial-gradient(circle at bottom, rgba(0,0,0,0.9), #0f0f12 75%);
  z-index: 1;
}

.netflix-title {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 20px;
  font-size: 1.8rem;
  letter-spacing: 0.6px;
}

.character-grid {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 22px;
}

.character-card {
  width: 160px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.25s ease;
}

.character-card img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 18px;
  border: 2px solid rgba(255,255,255,0.08);
}

.character-card:hover {
  transform: scale(1.2);
}

/* ======================
   CHAT
====================== */

.chat-box {
  height: 420px;
  overflow-y: auto;
  background: rgba(17, 17, 22, 0.85);
  backdrop-filter: blur(12px);
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}

.message {
  margin: 8px 0;
  white-space: pre-wrap;
}

.user {
  text-align: right;
  color: #c7a6ff;
}

.ai {
  text-align: left;
  color: #e5e5e5;
}

/* ======================
   INPUT AREA (NEW)
====================== */

.input-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.input-row input {
  flex: 1;
}

.icon-btn {
  width: 48px;
  min-width: 48px;
  cursor: pointer;
}

/* image preview */
.preview {
  margin-top: 10px;
  max-height: 160px;
  border-radius: 12px;
  overflow: hidden;
}

.preview img {
  width: 100%;
  object-fit: cover;
}

</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo-header">
    <img src="./images/whisperlogo.png" alt="Whisper Logo">
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="panel">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- CHARACTER SCREEN -->
  <div id="characterBox" class="panel hidden">
    <div class="netflix-bg" id="netflixBg"></div>
    <div class="netflix-overlay"></div>

    <h2 class="netflix-title">Who do you want to talk to?</h2>

    <div id="characterGrid" class="character-grid"></div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="panel hidden">

    <h2 id="charName">Select a character</h2>

    <div id="chat" class="chat-box"></div>

    <!-- IMAGE PREVIEW -->
    <div id="preview" class="preview hidden"></div>

    <!-- INPUT + CONTROLS -->
    <div class="input-row">

      <input id="msg" placeholder="Type message...">

      <!-- CAMERA / UPLOAD -->
      <input
        id="imageInput"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
      >

      <button class="icon-btn" onclick="document.getElementById('imageInput').click()">
        📷
      </button>

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
