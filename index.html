<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whisper AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ======================
   BASE (CINEMATIC + LIVING UI)
====================== */

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1a1a25, #0f0f12 65%);
  color: white;
  margin: 0;
  overflow-x: hidden;
}

/* subtle animated ambient glow */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 20%, rgba(124,77,255,0.08), transparent 40%),
              radial-gradient(circle at 80% 80%, rgba(0,200,255,0.05), transparent 45%);
  pointer-events: none;
  animation: floatGlow 10s ease-in-out infinite alternate;
}

@keyframes floatGlow {
  from { transform: translateY(0px); }
  to { transform: translateY(-10px); }
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

.panel {
  background: rgba(23, 23, 28, 0.85);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
  position: relative;
  box-shadow: 0 25px 70px rgba(0,0,0,0.5);
  transition: 0.3s ease;
}

.panel:hover {
  transform: translateY(-2px);
}

.hidden {
  display: none;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  box-sizing: border-box;
  font-family: inherit;
}

button {
  background: linear-gradient(135deg, #7c4dff, #9b6bff);
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
  font-weight: 500;
}

button:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
}

/* ======================
   LOGIN
====================== */

#loginBox {
  max-width: 420px;
  margin: auto;
}

/* ======================
   CHARACTER SCREEN (NETFLIX + EMOTION LAYER)
====================== */

#characterBox {
  overflow: hidden;
  min-height: 60vh;
  position: relative;
}

/* CINEMATIC BACKDROP */
.netflix-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(60px) brightness(0.22) saturate(1.4);
  transform: scale(1.35);
  z-index: 0;
  transition: 0.7s ease;
}

/* emotional lighting overlay */
.netflix-overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(124,77,255,0.18), transparent 55%),
    radial-gradient(circle at bottom, rgba(0,0,0,0.9), #0f0f12 75%);
  z-index: 1;
}

/* title */
.netflix-title {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 20px;
  font-size: 1.8rem;
  letter-spacing: 0.6px;
  text-shadow: 0 15px 40px rgba(0,0,0,0.9);
}

/* grid */
.character-grid {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 22px;
}

/* CHARACTER CARD (ALIVE FEEL) */
.character-card {
  width: 160px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.25s ease, filter 0.25s ease;
}

.character-card img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 18px;
  border: 2px solid rgba(255,255,255,0.08);
  box-shadow: 0 25px 60px rgba(0,0,0,0.7);
  transition: 0.25s ease;
}

.character-card h3 {
  margin-top: 10px;
  font-size: 14px;
  letter-spacing: 0.3px;
}

.character-card p {
  font-size: 12px;
  color: #aaa;
}

/* hover focus (alive zoom) */
.character-card:hover {
  transform: scale(1.2);
  z-index: 5;
}

.character-card:hover img {
  border: 2px solid #7c4dff;
  box-shadow: 0 0 40px rgba(124,77,255,0.9);
}

/* dim effect (used by JS emotion engine) */
.dim {
  opacity: 0.22;
  transform: scale(0.92);
  filter: blur(1.2px);
  transition: 0.25s ease;
}

/* ======================
   CHAT UI (CINEMATIC + BREATHING SPACE)
====================== */

.chat-box {
  height: 420px;
  overflow-y: auto;
  background: rgba(17, 17, 22, 0.85);
  backdrop-filter: blur(12px);
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.45);
}

/* messages */
.message {
  margin: 8px 0;
  white-space: pre-wrap;
  line-height: 1.4em;
}

/* user voice */
.user {
  text-align: right;
  color: #c7a6ff;
}

/* ai voice */
.ai {
  text-align: left;
  color: #e5e5e5;
}

/* subtle AI reaction styling */
.subtle {
  opacity: 0.7;
  font-size: 0.95em;
}

/* typing animation */
.typing {
  opacity: 0.6;
  font-style: italic;
  animation: pulse 1.2s infinite ease-in-out;
}

@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 0.8; }
  100% { opacity: 0.4; }
}

</style>
</head>

<body>

<div class="container">

  <h1>Whisper AI</h1>

  <!-- LOGIN -->
  <div id="loginBox" class="panel">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- CHARACTER SCREEN -->
  <div id="characterBox" class="panel hidden">

    <div class="netflix-bg" id="netflixBg"></div>
    <div class="netflix-overlay"></div>

    <h2 class="netflix-title">Who do you want to talk to?</h2>

    <div id="characterGrid" class="character-grid"></div>
  </div>

  <!-- CHAT -->
  <div id="chatBox" class="panel hidden">

    <h2 id="charName">Select a character</h2>

    <div id="chat" class="chat-box"></div>

    <input id="msg" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
